spring.application.name=auth-backend

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading_desk}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:45}
spring.datasource.hikari.minimum-idle=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Temporal Configuration
temporal.target-endpoint=${TEMPORAL_TARGET_ENDPOINT:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:default}
fetcher.similar-markets.workflow-execution-timeout=${SIMILAR_MARKETS_WORKFLOW_EXECUTION_TIMEOUT:3h}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Port
server.port=${SERVER_PORT:8080}

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Proxy Configuration (optional - uses environment variables)
proxy.host=${PROXY_HOST:#{null}}
proxy.port=${PROXY_PORT:#{null}}
proxy.username=${PROXY_USERNAME:#{null}}
proxy.password=${PROXY_PASSWORD:#{null}}
proxy.use.ssl=${PROXY_USE_SSL:false}
# 5-field standard cron format (min hr dom mon dow) — NOT 6-field Quartz format
fetcher.cron.stringUtc=${FETCHER_CRON_STRING_UTC:0 0 * * *}

# opinion.trade Open API. apikey header required on every request (OPINION_API_KEY in .env).
fetcher.opinion.base-url=${OPINION_BASE_URL:https://openapi.opinion.trade/openapi}
fetcher.opinion.api-key=${OPINION_API_KEY:}

# Arbitrage Monitor Configuration
arbitrage.threshold=${ARBITRAGE_THRESHOLD:}
arbitrage.kalshi-api-key=${KALSHI_API_KEY}
arbitrage.kalshi-private-key=${KALSHI_PRIVATE_KEY}
arbitrage.test-pair.polymarket-slug=${POLYMARKET_MARKET_SLUG:will-jd-vance-win-the-2028-republican-presidential-nomination}
arbitrage.test-pair.polymarket-yes-asset-id=${POLYMARKET_YES_ASSET_ID:"40081275558852222228080198821361202017557872256707631666334039001378518619916"}
arbitrage.test-pair.polymarket-no-asset-id=${POLYMARKET_NO_ASSET_ID:"78633590736077251574794513664747155551297291244492840448622550955320930591622"}
arbitrage.test-pair.kalshi-ticker=${KALSHI_MARKET_TICKER:KXPRESNOMR-28-JDV}
arbitrage.polymarket-clob-url=${POLYMARKET_CLOB_URL:https://clob.polymarket.com}
arbitrage.polymarket-deposit-wallet-address=${DEPOSIT_WALLET_ADDRESS}
arbitrage.polymarket-signature-type=${SIGNATURE_TYPE:3}
arbitrage.polymarket-session-signer=${POLY_SESSION_SIGNER:false}
arbitrage.trading-enabled=${TRADING_ENABLED:false}
arbitrage.consecutive-errors-count-to-stop-trading=${CONSECUTIVE_ERRORS_COUNT_TO_STOP_TRADING:2}
# Arbitrage prefetch settings
arbitrage.prefetch-timeout-ms=${ARBITRAGE_PREFETCH_TIMEOUT:300000}
arbitrage.kalshi-api-url=https://external-api.kalshi.com/trade-api/v2
arbitrage.polymarket-api-url=https://clob.polymarket.com
arbitrage.polymarket-data-api-url=${POLYMARKET_DATA_API_URL:https://data-api.polymarket.com}
arbitrage.polymarket-private-key=${POLY_PRIVATE_KEY}


# Arbitrage pair limit
arbitrage.pair-limit=${ARBITRAGE_PAIR_LIMIT:100}
arbitrage.max-order-cost=${MAX_ORDER_COST:6}
arbitrage.active-pairs-limit=${ACTIVE_PAIRS_LIMIT:1}
logging.level.hzpro.com.tradingdesk.arbitrage=DEBUG

external.api.key=${EXTERNAL_API_KEY:some-key}

# Current portfolio position snapshots
portfolio.positions.scheduling-enabled=${PORTFOLIO_POSITIONS_SCHEDULING_ENABLED:true}
portfolio.positions.refresh-delay-ms=${PORTFOLIO_POSITIONS_REFRESH_DELAY_MS:300000}
portfolio.positions.initial-delay-ms=${PORTFOLIO_POSITIONS_INITIAL_DELAY_MS:0}
