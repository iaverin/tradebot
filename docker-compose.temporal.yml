services:
  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: trading-desk-temporal
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: ${TEMPORAL_DB:-postgres12}
      DB_PORT: ${TEMPORAL_DB_PORT:-5432}
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PWD:-postgres}
      POSTGRES_SEEDS: ${TEMPORAL_POSTGRES_SEEDS:-postgres}
    networks:
      - app-network

  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: trading-desk-temporal-ui
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    depends_on:
      - temporal
    networks:
      - app-network

  temporal-ui-proxy:
    image: nginx:alpine
    container_name: trading-desk-temporal-ui-proxy
    expose:
      - "80"
    ports:
      - "8088:80"
    environment:
      TEMPORAL_UI_USER: ${TEMPORAL_UI_USER:-admin}
      TEMPORAL_UI_PASSWORD: ${TEMPORAL_UI_PASSWORD:-admin}
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://temporal-ui:8080}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e &&
        SHA=$$(printf '%s' "$$TEMPORAL_UI_PASSWORD" | sha1sum | cut -d' ' -f1 | xxd -r -p | base64) &&
        printf '%s:{SHA}%s\n' "$$TEMPORAL_UI_USER" "$$SHA" > /etc/nginx/.htpasswd &&
        printf 'server {\n  listen 80;\n  location / {\n    auth_basic "Temporal UI";\n    auth_basic_user_file /etc/nginx/.htpasswd;\n    proxy_pass '"$$TEMPORAL_UI_URL"';\n  }\n}\n'
        > /etc/nginx/conf.d/default.conf &&
        exec nginx -g 'daemon off;'
    depends_on:
      - temporal-ui
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
